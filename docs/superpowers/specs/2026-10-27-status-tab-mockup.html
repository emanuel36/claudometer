<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Claudometer · Sessions mockup</title>
<style>
:root { --accent: #d97757; --y: #f8e45c; --b: #62a0ea; --g: #57e389; --r: #ed333b; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; color: #fff; overflow-x: hidden;
  font-family: Ubuntu, Cantarell, 'Noto Sans', 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #3a3f58, #1f2233) fixed;
}

/* Top bar */
.topbar {
  height: 32px; background: #000; position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
  font-size: 14px; font-weight: 700; user-select: none;
}
.tb-left, .tb-right { display: flex; align-items: center; height: 100%; }
.tb-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex;
  align-items: center; gap: 2px; height: 100%; }
.tb-btn { height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 10px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: rgba(255,255,255,.12); }
.tb-btn.active { background: rgba(255,255,255,.22); }
.ws { display: flex; gap: 6px; align-items: center; }
.ws .pill { width: 30px; height: 8px; border-radius: 4px; background: #fff; }
.ws .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.45); }
.tb-right svg { width: 16px; height: 16px; fill: #fff; }
.tb-right .tb-btn { gap: 10px; }
.gauge { position: relative; display: flex; }
.gauge.badge::after { content: ''; position: absolute; top: -1px; right: -2px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #000; }
.tb-sep { width: 1px; height: 12px; background: rgba(255,255,255,.3); margin: 0 2px; }
.lights { display: flex; gap: 4px; align-items: center; }
.lights i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tpill { min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px; font-size: 11px;
  display: inline-flex; align-items: center; justify-content: center; color: #000; }
.tpill.y { background: var(--y); } .tpill.g { background: var(--g); }
.dimtxt { color: rgba(255,255,255,.55); }

/* Popup, copied from stylesheet.css */
.popup { position: absolute; top: 36px; z-index: 6; background: #353535; border-radius: 14px;
  border: 1px solid rgba(255,255,255,.08); box-shadow: 0 4px 12px rgba(0,0,0,.45);
  padding: 10px 12px 9px; }
.content { width: 244px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 8px; }
.tab { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center;
  padding: 4px 0 3px; color: #a8a8a8; border-bottom: 2px solid transparent; margin-bottom: -1px;
  cursor: pointer; position: relative; }
.tab:hover, .tab.sel { color: #fff; }
.tab.sel { border-bottom-color: #fff; }
.tab span { font-size: 10px; margin-top: 2px; }
.tab .tbadge { position: absolute; top: 3px; left: calc(50% + 5px); width: 6px; height: 6px;
  border-radius: 50%; background: var(--accent); }
svg.i16 { width: 16px; height: 16px; fill: currentColor; display: block; }
.hdr { font-size: 9px; font-weight: 600; letter-spacing: 1px; color: #a0a0a0; text-transform: uppercase; }
.name { font-size: 12px; color: #e6e6e6; }
.val { font-size: 12px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.sec { font-size: 12px; color: #a0a0a0; font-variant-numeric: tabular-nums; }
.small { font-size: 11px; color: #a0a0a0; }
.r { text-align: right; } .c { text-align: center; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.trow { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
.hrow { display: flex; align-items: center; gap: 8px; padding-bottom: 2px; }
.hrow.gap { padding-top: 12px; }
.tline { height: 1px; background: rgba(255,255,255,.10); }
.meter { width: 56px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.10); position: relative; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.foot { border-top: 1px solid rgba(255,255,255,.10); margin-top: 8px; padding-top: 6px;
  display: flex; align-items: center; gap: 8px; }
.foot .st { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a0a0a0; }
.foot .st svg { width: 12px; height: 12px; fill: #a0a0a0; }
.foot-btn { padding: 4px; border-radius: 6px; color: #a8a8a8; display: flex; cursor: pointer; }
.foot-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
.foot-btn svg { width: 14px; height: 14px; fill: currentColor; }
.switch { display: flex; background: rgba(255,255,255,.08); border-radius: 8px; padding: 2px; gap: 2px;
  margin-bottom: 10px; }
.switch b { flex: 1; text-align: center; padding: 3px 0; border-radius: 6px; font-size: 12px;
  color: #b0b0b0; font-weight: 400; cursor: pointer; white-space: nowrap; }
.switch b.sel { background: rgba(255,255,255,.16); color: #fff; }
.cropped { display: block; }

/* Session rows */
.srow { cursor: pointer; }
.srow:hover .name { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.3); }
.mark { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.mark.acc { background: var(--accent); }
.mark.hollow { border: 1.5px solid #fff; }
.mark.solid { background: #fff; }
.mark.dim { background: rgba(255,255,255,.22); }
.mark.round { border-radius: 50%; }
.stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.expand { padding: 0 0 10px 16px; }
.quote { font-size: 11.5px; color: #c8c8c8; line-height: 1.4; border-left: 2px solid rgba(255,255,255,.18);
  padding: 2px 0 2px 8px; margin-bottom: 8px; }
.mono { font-family: 'Ubuntu Mono', 'DejaVu Sans Mono', monospace; font-size: 12px; color: #e6e6e6;
  background: rgba(0,0,0,.28); border-radius: 4px; padding: 3px 6px; display: block; margin-bottom: 8px; }
.acts { display: flex; gap: 6px; }
.btn { flex: 1; text-align: center; padding: 4px 0; border-radius: 6px; background: rgba(255,255,255,.08);
  font-size: 12px; color: #e6e6e6; cursor: pointer; }
.btn:hover { background: rgba(255,255,255,.16); color: #fff; }
.btn.pri { background: var(--accent); color: #fff; }
.btn.pri:hover { background: #e08a6d; }
.entry { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px; color: #fff; font: 12px Ubuntu, Cantarell, sans-serif; padding: 5px 8px; outline: none;
  margin-bottom: 6px; }
.entry:focus { border-color: var(--accent); }
.late { color: var(--y) !important; }

/* Side panels */
.panel { position: fixed; top: 52px; background: rgba(18,18,22,.86); border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; padding: 16px 18px; font-size: 13px; line-height: 1.5; color: #ddd; z-index: 4; }
.ctrl { left: 20px; width: 290px; }
.notes { right: 20px; width: 360px; max-height: calc(100vh - 72px); overflow: auto; }
.panel h2 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #a0a0a0; margin: 0 0 8px; }
.panel h2 + * { margin-top: 0; }
.opt { padding: 8px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
.opt:hover { background: rgba(255,255,255,.06); }
.opt.sel { background: rgba(217,119,87,.16); border-color: rgba(217,119,87,.5); }
.opt b { color: #fff; } .opt div { font-size: 12px; color: #a8a8a8; }
.ctrl .switch { margin: 0 0 12px; }
.ctrl .btn { display: block; margin-top: 6px; }
.notes h3 { margin: 0 0 4px; font-size: 16px; color: #fff; }
.notes .lead { color: #bbb; margin: 0 0 12px; }
.notes ul { margin: 4px 0 12px; padding-left: 18px; }
.notes li { margin-bottom: 4px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 1px 6px;
  border-radius: 4px; margin-right: 4px; }
.tag.ok { background: rgba(87,227,137,.18); color: var(--g); }
.tag.no { background: rgba(237,51,59,.2); color: #ff7b81; }
.hint { font-size: 11.5px; color: #8a8a8a; margin-top: 10px; }

/* Notification banner and toast */
.notif { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); width: 400px; z-index: 9;
  background: #2b2b2f; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
  border: 1px solid rgba(255,255,255,.08); padding: 12px 14px; }
.notif .nt { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.notif .nt svg { width: 32px; height: 32px; flex: none; }
.notif .title { font-weight: 700; font-size: 13px; }
.notif .body { font-size: 12.5px; color: #c8c8c8; }
.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(28,28,30,.96); padding: 10px 18px; border-radius: 999px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); }
@media (max-width: 1180px) {
  .panel { position: static; width: auto; margin: 16px; max-height: none; }
  .stage { padding-top: 470px; }
}
</style>
</head>

function scenario(n) {
  const list = JSON.parse(JSON.stringify(BASE));
  const by = id => list.find(s => s.id === id);
  if (n === 'working') {
    Object.assign(by('k265'), {state: 'working', detail: 'Flashing the device', since: 2});
    Object.assign(by('jobs'), {state: 'done', unseen: true, detail: 'Moved 12 drafts', since: 1,
      last: 'Moved the 12 drafts to archive/.'});
    Object.assign(by('port'), {state: 'working', unseen: false, detail: 'Retrying the build', since: 5});
  } else if (n === 'quiet') {
    for (const s of list) {
      if (s.state === 'needs' || s.state === 'error') Object.assign(s, {state: 'idle', detail: 'Waiting for a prompt'});
      if (s.state === 'working') Object.assign(s, {state: 'done', detail: 'Finished'});
      s.unseen = false;
    }
  }
  return list;
}

const esc = t => t.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
const needs = () => S.list.filter(s => s.state === 'needs');
const attention = s => s.state === 'needs' || ((s.state === 'done' || s.state === 'error') && s.unseen);
const RANK = s => s.state === 'needs' ? 0 : attention(s) ? (s.state === 'error' ? 1 : 2) :
  s.state === 'working' ? 3 : s.state === 'idle' ? 6 : 5;
const sorted = () => [...S.list].sort((a, b) => RANK(a) - RANK(b) || a.since - b.since);
const stateLabel = s => s.state === 'needs' ? (s.kind === 'permission' ? 'Permission' : 'Question') :
  {working: 'Working', done: 'Done', error: 'Error', idle: 'Idle'}[s.state];
const timeLabel = s => (s.state === 'done' || s.state === 'error' || s.state === 'idle')
  ? `${fmt(s.since)} ago` : fmt(s.since);
const lightColor = s => ({needs: 'var(--y)', working: 'var(--b)',
  done: s.unseen ? 'var(--g)' : 'rgba(87,227,137,.35)', error: s.unseen ? 'var(--r)' : 'rgba(237,51,59,.45)',
  idle: 'rgba(255,255,255,.3)'}[s.state]);

/* Top bar */
function topbar() {
  const n = S.list.filter(attention).length;
  const gauge = (badge) => `<span class="gauge${badge ? ' badge' : ''}">${GAUGE}</span>`;
  const pct = '<span style="color:#de8668">42%</span>';
  const act = k => S.open === k ? ' active' : '';
  let html = '<div class="tb-btn">Tue 27 Oct&nbsp; 09:41</div>';
  if (S.opt === 'A') {
    html += `<div class="tb-btn${act('main')}" data-pop="main">${gauge(n > 0)}${pct}</div>`;
  } else if (S.opt === 'B') {
    const extra = n ? `<span class="tb-sep"></span>${ico('Sessions')}<span style="color:var(--accent)">${n}</span>` : '';
    html += `<div class="tb-btn${act('main')}" data-pop="main">${gauge(false)}${pct}${extra}</div>`;
  } else if (S.opt === 'C') {
    const dots = sorted().map(s => `<i class="${s.state === 'needs' ? 'pulse' : ''}" style="background:${lightColor(s)}"></i>`).join('');
    html += `<div class="tb-btn${act('main')}" data-pop="main">${gauge(false)}${pct}<span class="lights">${dots}</span></div>`;
  } else {
    const nd = needs().length;
    const dn = S.list.filter(s => attention(s) && s.state !== 'needs').length;
    const wk = S.list.filter(s => s.state === 'working').length;
    let tail = '';
    if (nd) tail += `<span class="tpill y">${nd}</span>`;
    if (dn) tail += `<span class="tpill g">${dn}</span>`;
    if (!nd && !dn) tail = `<span class="dimtxt">${wk}</span>`;
    html += `<div class="tb-btn${act('main')}" data-pop="main">${gauge(false)}${pct}</div>` +
      `<div class="tb-btn${act('sess')}" data-pop="sess">${ico('Sessions')}${tail}</div>`;
  }
  document.getElementById('center').innerHTML = html;
}

/* Popup pieces */
function footer(text, icon = 'check') {

function limits() {
  const row = (name, pct, left) => `<div class="trow"><span class="name" style="width:74px">${name}</span>` +
    `<span class="meter"><i style="width:${Math.max(8, 56 * pct / 100)}px"></i></span>` +
    `<span class="val r" style="width:36px">${pct}%</span><span class="sec c" style="width:54px">${left}</span></div>`;
  return `<div class="hrow"><span class="hdr" style="width:74px">Limit</span><span style="width:56px"></span>` +
    `<span class="hdr r" style="width:36px">Used</span><span class="hdr c" style="width:54px">Left</span></div>` +
    row('5-hour', 42, '2h 14m') + '<div class="tline"></div>' + row('Weekly', 18, '3d 5h');
}

/* A: section at the end of Limits */
function sectionA() {
  const att = sorted().filter(attention);
  const rest = S.list.filter(s => !attention(s));
  const wk = rest.filter(s => s.state === 'working').length;
  const idle = rest.length - wk;
  let h = '<div class="tline"></div><div class="hrow gap"><span class="hdr" style="flex:1">Sessions</span>' +
    `<span class="hdr">${att.length ? att.length + ' waiting for you' : 'nothing waiting'}</span></div>`;
  att.forEach((s, i) => {
    h += (i ? '<div class="tline"></div>' : '') +
      `<div class="trow srow" data-a="open" data-id="${s.id}"><span class="mark ${s.state === 'needs' ? 'acc' : 'solid'}"></span>` +
      `<span class="name ell" style="flex:1">${s.name}</span><span class="sec">${stateLabel(s)}</span>` +
      `<span class="val r" style="width:52px">${timeLabel(s).replace(' ago', '')}</span></div>`;
  });
  h += `<div class="tline"></div><div class="trow"><span class="sec" style="flex:1">${wk} working · ${idle} idle</span></div>`;
  return h;
}

/* B: calm tab, one color */
function sessionsB() {
  const groups = [
    ['Needs you', s => s.state === 'needs'],
    ['Working', s => s.state === 'working'],
    ['Finished', s => ['done', 'error', 'idle'].includes(s.state)],
  ];
  let h = '';
  groups.forEach(([title, f], gi) => {
    const items = sorted().filter(f);
    if (!items.length) return;
    h += `<div class="hrow${gi && h ? ' gap' : ''}"><span class="hdr" style="flex:1">${title}</span><span class="hdr">${items.length}</span></div>`;
    items.forEach((s, i) => {
      const mk = s.state === 'needs' ? 'acc' : s.state === 'working' ? 'hollow' : attention(s) ? 'solid' : 'dim';
      h += (i ? '<div class="tline"></div>' : '') +
        `<div class="trow srow" data-a="open" data-id="${s.id}"><span class="mark ${mk}"></span>` +
        `<span class="name ell" style="flex:1">${s.name}</span>` +
        `<span class="sec r" style="width:70px">${stateLabel(s)}</span>` +
        `<span class="${s.state === 'needs' ? 'val' : 'sec'} r" style="width:44px">${fmt(s.since)}</span></div>`;
    });
  });
  return h;
}

/* C: lights, expandable rows with actions */
function actions(s, withReply) {
  if (s.state === 'needs' && s.kind === 'permission')
    return `<div class="acts"><div class="btn pri" data-a="allow" data-id="${s.id}">Allow</div>` +
      `<div class="btn" data-a="deny" data-id="${s.id}">Deny</div><div class="btn" data-a="open" data-id="${s.id}">Open</div></div>`;
  if (s.state === 'needs' && withReply)
    return `<input class="entry" data-id="${s.id}" placeholder="Reply to Claude… (Enter)">` +
      `<div class="acts"><div class="btn" data-a="open" data-id="${s.id}">Open terminal</div></div>`;
  return `<div class="acts"><div class="btn" data-a="open" data-id="${s.id}">Open terminal</div></div>`;
}

function sessionsC() {
  return sorted().map((s, i) => {
    const open = S.exp === s.id;
    let h = (i ? '<div class="tline"></div>' : '') +
      `<div class="trow srow" data-a="expand" data-id="${s.id}">` +
      `<span class="mark round ${s.state === 'needs' ? 'pulse' : ''}" style="background:${lightColor(s)}"></span>` +
      `<span class="stack"><span class="name ell">${s.name}</span><span class="small ell">${stateLabel(s)} · ${esc(s.detail)}</span></span>` +
      `<span class="${s.state === 'needs' ? 'val' : 'sec'} r" style="width:52px">${timeLabel(s).replace(' ago', '')}</span></div>`;
    if (open) h += `<div class="expand"><div class="quote">${esc(s.last)}</div>${actions(s, false)}</div>`;
    return h;
  }).join('');
}

    working: S.list.filter(s => s.state === 'working'),
    done: S.list.filter(s => ['done', 'error', 'idle'].includes(s.state)),
  };
  const sw = [['needs', 'Needs you'], ['working', 'Working'], ['done', 'Done']].map(([k, l]) =>
    `<b class="${S.filter === k ? 'sel' : ''}" data-a="filter" data-f="${k}">${l} ${sets[k].length}</b>`).join('');
  const items = sorted().filter(s => sets[S.filter].includes(s));
  let body = items.map((s, i) => {
    const late = s.state === 'needs' && s.since >= 3;
    let h = (i ? '<div class="tline"></div>' : '') +
      `<div class="trow srow" data-a="${s.state === 'needs' ? 'noop' : 'open'}" data-id="${s.id}">` +
      `<span class="mark round" style="background:${lightColor(s)}"></span>` +
      `<span class="stack"><span class="name ell">${s.name}</span>` +
      (s.state === 'needs' ? '' : `<span class="small ell">${esc(s.detail)}</span>`) + '</span>' +
      `<span class="${late ? 'val late' : s.state === 'needs' ? 'val' : 'sec'} r" style="width:52px">${timeLabel(s).replace(' ago', '')}</span></div>`;
    if (s.state === 'needs') {
      h += '<div class="expand">' + (s.kind === 'permission'
        ? `<span class="mono">$ ${esc(s.cmd)}</span>` : `<div class="quote">${esc(s.detail)}</div>`) +
        actions(s, true) + '</div>';
    }
    return h;
  }).join('');
  if (!items.length) body = `<div style="text-align:center;padding:28px 0 22px">${ico('Sessions', 'i16')}` +
    '<div class="val" style="margin-top:8px;font-size:13px">Nothing here</div>' +
    '<div class="sec" style="margin-top:3px">Sessions show up as they change.</div></div>';
  return `<div class="content"><div class="switch">${sw}</div>${body}${footer('Super+J · next one waiting', 'key')}</div>`;
}

function mainPopup() {
  const names = tabsFor(S.opt);
  if (!names.includes(S.tab[S.opt])) S.tab[S.opt] = names[0];
  const cur = S.tab[S.opt];
  const n = S.list.filter(attention).length;
  const badged = t => n && ((S.opt === 'B' && t === 'Sessions') || (S.opt === 'A' && t === S.aName));
  const tabs = names.map(t => `<div class="tab${t === cur ? ' sel' : ''}" data-a="tab" data-t="${t}">` +
    `${ico(t)}<span>${t}</span>${badged(t) && t !== cur ? '<i class="tbadge"></i>' : ''}</div>`).join('');
  let body, foot;
  if (cur === 'Limits' || A_NAMES.includes(cur)) {
    body = limits() + (S.opt === 'A' ? sectionA() : '');
    foot = footer('Updated 2 min ago');
  } else if (cur === 'Sessions') {
    body = S.opt === 'B' ? sessionsB() : sessionsC();
    foot = footer(`${S.list.length} sessions · live`);
  } else {
    body = `<div class="cropped">${SVGS[cur]}</div>`;
    foot = footer('Updated 2 min ago');
  }
  return `<div class="content"><div class="tabs">${tabs}</div>${body}${foot}</div>`;
}

function render() {
  topbar();
  const stage = document.getElementById('stage');
  stage.innerHTML = S.open ? `<div class="popup" id="popup">${S.open === 'sess' ? sessPopupD() : mainPopup()}</div>` : '';
  if (S.open) {
    const anchor = document.querySelector(`[data-pop="${S.open}"]`);
    const pop = document.getElementById('popup');
    const r = anchor.getBoundingClientRect();
    const left = Math.max(8, Math.min(window.innerWidth - pop.offsetWidth - 8, r.left + r.width / 2 - pop.offsetWidth / 2));
    pop.style.left = left + 'px';
  }
  document.getElementById('opts').innerHTML = Object.entries(OPTIONS).map(([k, o]) =>
    `<div class="opt${S.opt === k ? ' sel' : ''}" data-a="opt" data-o="${k}"><b>${o.title}</b><div>${o.short}</div></div>`).join('');
  document.getElementById('scen').innerHTML = [['needs', 'Esperando'], ['working', 'Trabalhando'], ['quiet', 'Quieto']]
    .map(([k, l]) => `<b class="${S.scen === k ? 'sel' : ''}" data-a="scen" data-s="${k}">${l}</b>`).join('');
  document.getElementById('notes').innerHTML = NOTES[S.opt];
  document.getElementById('aNames').hidden = S.opt !== 'A';
  document.getElementById('aSwitch').innerHTML = A_NAMES.map(k =>
    `<b class="${S.aName === k ? 'sel' : ''}" data-a="aname" data-n="${k}">${k}</b>`).join('');
  document.getElementById('notifyBtn').hidden = S.opt !== 'D';
}

let toastTimer, notifTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.innerHTML = ''), 2600);
}

function notify() {
  const s = needs()[0];
  if (!s) return toast('Nenhuma seção esperando você neste cenário');
  const body = s.kind === 'permission' ? `Wants to run <b>${esc(s.cmd)}</b>` : esc(s.detail);
  const acts = s.kind === 'permission'
    ? `<div class="btn pri" data-a="allow" data-id="${s.id}">Allow</div><div class="btn" data-a="deny" data-id="${s.id}">Deny</div>`
    : '';
  document.getElementById('notif').innerHTML = `<div class="notif"><div class="nt">${GAUGE.replace('width="16" height="16"', '')}` +
    `<div><div class="title">${s.name} needs you</div><div class="body">${body}</div></div></div>` +
    `<div class="acts">${acts}<div class="btn" data-a="open" data-id="${s.id}">Open</div></div></div>`;
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => (document.getElementById('notif').innerHTML = ''), 8000);
}

function act(a, id, text) {
  const s = S.list.find(x => x.id === id);
  if (!s) return;
  if (a === 'allow') {
    Object.assign(s, {state: 'working', detail: `Running ${s.cmd}`, since: 0});
    toast(`Allowed · ${s.name} continues`);
  } else if (a === 'deny') {
    Object.assign(s, {state: 'working', detail: 'Handling the denial', since: 0});
    toast(`Denied · ${s.name} was told no`);
  } else if (a === 'reply') {
    Object.assign(s, {state: 'working', detail: 'Reading your reply', since: 0});
    toast(`Sent to ${s.name}: “${esc(text)}”`);
  } else if (a === 'open') {
    s.unseen = false;
    toast(`Ghostty brought to the front · ${s.name}`);
  }
  document.getElementById('notif').innerHTML = '';
  render();
}

document.addEventListener('click', e => {
  const pop = e.target.closest('[data-pop]');
  if (pop) { S.open = S.open === pop.dataset.pop ? null : pop.dataset.pop; render(); return; }
  const el = e.target.closest('[data-a]');
  if (!el) {
    if (!e.target.closest('.popup, .panel, .notif, .entry')) { S.open = null; render(); }
    return;
  }
  const a = el.dataset.a;
  if (a === 'tab') { S.tab[S.opt] = el.dataset.t; S.exp = null; }
  else if (a === 'opt') {
    S.opt = el.dataset.o; S.exp = null; S.open = 'main';
    if (S.opt === 'C' && needs().length) S.tab.C = 'Sessions';
  }
  else if (a === 'scen') {
    S.scen = el.dataset.s; S.list = scenario(S.scen); S.exp = null;
    if (S.opt === 'C' && needs().length) S.tab.C = 'Sessions';
  }
  else if (a === 'reset') { S.list = scenario(S.scen); S.exp = null; }
  else if (a === 'expand') { S.exp = S.exp === el.dataset.id ? null : el.dataset.id; }
  else if (a === 'filter') { S.filter = el.dataset.f; }
  else if (a === 'aname') { S.aName = el.dataset.n; S.tab.A = S.aName; S.open = 'main'; }
  else if (a === 'notify') { notify(); return; }
  else if (a === 'toast') { toast(el.dataset.msg); return; }
  else if (a === 'noop') { return; }
  else { act(a, el.dataset.id); return; }
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('entry') && e.target.value.trim())
    act('reply', e.target.dataset.id, e.target.value.trim());
  if (e.key === 'j' && e.metaKey) {
    const s = needs()[0];
    toast(s ? `Super+J · Ghostty brought to the front · ${s.name}` : 'Super+J · nothing waiting');
  }
});
window.addEventListener('resize', render);
const [hashOpt, hashOpen] = location.hash.slice(1).split('-');
if (OPTIONS[hashOpt]) S.opt = hashOpt;
if (hashOpen === 'sess' && S.opt === 'D') S.open = 'sess';
if (A_NAMES.includes(hashOpen)) { S.aName = hashOpen; S.tab.A = 'Projects'; }
render();
</script>
</body>
</html>
